[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-thesis"
version = "0.1.0"
description = "Reproducible evaluation of runtime controls for AgentDojo agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentdojo==0.1.35",
  "openai>=1.59.7,<2",
  "pydantic>=2.7.1,<3",
  "numpy>=2,<3",
  "matplotlib>=3.9,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eval = ["ui_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
