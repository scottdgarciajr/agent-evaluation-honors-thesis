name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Verify dependencies and code
        run: |
          python -m pip check
          python -m ruff check src tests scripts
      - name: Run offline tests
        run: python -m pytest -q
      - name: Validate benchmark configuration
        run: python -m agent_eval.cli validate --config configs/pilot.json
